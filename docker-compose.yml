services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eam
      POSTGRES_PASSWORD: eam_secret
      POSTGRES_DB: enterprise_eam
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eam -d enterprise_eam"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://eam:eam_secret@db:5432/enterprise_eam
      JWT_SECRET: change-me-in-production
      UPLOAD_DIR: /app/uploads
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
